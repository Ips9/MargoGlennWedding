<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Margo & Glenn — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f0e7;color:#2d2b24}header{background:#fff;border-bottom:1px solid #ddd6c8;padding:20px 32px;display:flex;align-items:center;justify-content:space-between}header h1{margin:0;font-size:22px;font-weight:600}header span{color:#777;font-size:14px}main{max-width:1500px;margin:auto;padding:32px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:28px}.card,.section{background:#fff;border:1px solid #ddd6c8;border-radius:12px}.card{padding:18px}.card-label{font-size:13px;color:#777;margin-bottom:8px}.card-value{font-size:30px;font-weight:600}.section{margin-bottom:24px;overflow:hidden}.section-header{padding:18px 20px;border-bottom:1px solid #eee8dc;display:flex;align-items:center;justify-content:space-between}.section-header h2{margin:0;font-size:18px}.section-body{padding:20px}.error{background:#fbe9e9;color:#8a3030;border:1px solid #e6bcbc;border-radius:10px;padding:16px;margin-bottom:24px}.loading{padding:30px;text-align:center;color:#777}button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#2f3321;color:#fff}button:hover{opacity:.9}button:disabled{opacity:.5;cursor:not-allowed}.invitation{border:1px solid #e1dbcf;border-radius:12px;margin-bottom:16px;overflow:hidden}.invitation-head{padding:16px 18px;background:#faf8f3;display:flex;gap:16px;align-items:center;justify-content:space-between}.invitation-code{font-size:17px;font-weight:650;letter-spacing:.08em}.invitation-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}.status-active{background:#e6f4ea;color:#26733a}.status-inactive{background:#f3e8e8;color:#8a3c3c}.status-attending{background:#e6f4ea;color:#26733a}.status-declined{background:#f3e8e8;color:#8a3c3c}.status-pending{background:#f3efe3;color:#806d35}.guest{padding:18px;border-top:1px solid #eee8dc}.guest:first-child{border-top:0}.guest-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.guest-name{font-weight:650;font-size:17px;margin-bottom:5px}.guest-email{font-size:13px;color:#777}.guest-statuses{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.dietary{margin-top:14px;padding:12px 14px;background:#faf8f3;border:1px solid #eee8dc;border-radius:8px;font-size:13px}.dietary-title{font-weight:650;margin-bottom:7px}.dietary-item{margin:4px 0;color:#555}.history{margin-top:14px;font-size:12px;color:#777}.history summary{cursor:pointer;color:#555;font-weight:600}.history-row{padding:4px 0}.empty{color:#888;font-style:italic}@media(max-width:700px){main{padding:16px}header{padding:16px}.invitation-head,.guest-top{align-items:flex-start;flex-direction:column}.section-body{padding:14px}}
</style>
</head>
<body>
<header><div><h1>Margo & Glenn — Admin</h1><span id="adminEmail">Laden...</span></div></header>
<main>
<div id="errorContainer"></div>
<div class="cards">
<div class="card"><div class="card-label">Uitnodigingen</div><div class="card-value" id="statInvitations">—</div></div>
<div class="card"><div class="card-label">Actieve uitnodigingen</div><div class="card-value" id="statActiveInvitations">—</div></div>
<div class="card"><div class="card-label">Gasten</div><div class="card-value" id="statGuests">—</div></div>
<div class="card"><div class="card-label">Diner aanwezig</div><div class="card-value" id="statDinnerAttending">—</div></div>
<div class="card"><div class="card-label">Diner niet aanwezig</div><div class="card-value" id="statDinnerDeclined">—</div></div>
<div class="card"><div class="card-label">Avond aanwezig</div><div class="card-value" id="statEveningAttending">—</div></div>
<div class="card"><div class="card-label">Avond niet aanwezig</div><div class="card-value" id="statEveningDeclined">—</div></div>
</div>
<section class="section"><div class="section-header"><h2>Uitnodigingen & RSVP's</h2><button onclick="loadDashboard()">Vernieuwen</button></div><div class="section-body"><div id="invitationContainer" class="loading">Dashboard laden...</div></div></section>
</main>
<script>
async function loadDashboard(){
 const container=document.getElementById('invitationContainer'),errorContainer=document.getElementById('errorContainer');
 errorContainer.innerHTML='';container.innerHTML='<div class="loading">Dashboard laden...</div>';
 try{
  const response=await fetch('/admin/api/dashboard',{cache:'no-store'});
  const contentType=response.headers.get('content-type')||'';
  const text=await response.text();
  let data;
  try{data=JSON.parse(text)}catch{throw new Error(`Admin API gaf geen JSON terug (HTTP ${response.status}). Controleer de Worker deployment en Access. ${contentType?`Content-Type: ${contentType}`:''}`)}
  if(!response.ok||!data.ok)throw new Error(data.error||'Dashboard kon niet worden geladen.');
  document.getElementById('adminEmail').textContent=data.admin?.email||'Authenticated';
  document.getElementById('statInvitations').textContent=data.summary.invitations;
  document.getElementById('statActiveInvitations').textContent=data.summary.activeInvitations;
  document.getElementById('statGuests').textContent=data.summary.guests;
  document.getElementById('statDinnerAttending').textContent=data.summary.dinnerAttending;
  document.getElementById('statDinnerDeclined').textContent=data.summary.dinnerDeclined;
  document.getElementById('statEveningAttending').textContent=data.summary.eveningAttending;
  document.getElementById('statEveningDeclined').textContent=data.summary.eveningDeclined;
  container.innerHTML=Array.isArray(data.invitations)&&data.invitations.length?data.invitations.map(renderInvitation).join(''):'<p class="empty">Nog geen uitnodigingen.</p>';
 }catch(error){console.error(error);errorContainer.innerHTML=`<div class="error">${escapeHtml(error.message)}</div>`;container.innerHTML=''}
}
function renderInvitation(invitation){
 const guests=Array.isArray(invitation.guests)?invitation.guests:[];
 return `<div class="invitation"><div class="invitation-head"><div><div class="invitation-code">${escapeHtml(invitation.invitationCode)}</div><div class="invitation-meta"><span class="status ${invitation.active?'status-active':'status-inactive'}">${invitation.active?'Actief':'Inactief'}</span><span>${guests.length} ${guests.length===1?'gast':'gasten'}</span></div></div><button onclick="toggleInvitation(${invitation.id},${!invitation.active})">${invitation.active?'Deactiveren':'Activeren'}</button></div>${guests.length?guests.map(renderGuest).join(''):'<div class="guest empty">Geen gasten.</div>'}</div>`
}
function renderGuest(guest){
 const statuses=[];
 if(guest.invitedToDinner)statuses.push(`<span class="status ${statusClass(guest.dinnerRsvpStatus)}">Diner: ${statusText(guest.dinnerRsvpStatus)}</span>`);
 if(guest.invitedToEvening)statuses.push(`<span class="status ${statusClass(guest.eveningRsvpStatus)}">Avond: ${statusText(guest.eveningRsvpStatus)}</span>`);
 const dietary=renderDietary(guest.dietaryRequirements);
 const history=Array.isArray(guest.rsvpHistory)&&guest.rsvpHistory.length?`<details class="history"><summary>${guest.rsvpHistory.length} RSVP ${guest.rsvpHistory.length===1?'antwoord':'antwoorden'} in historiek</summary>${guest.rsvpHistory.map(r=>`<div class="history-row">${escapeHtml(r.eventPart)} · ${escapeHtml(statusText(r.status))} · ${escapeHtml(r.createdAt||'')}</div>`).join('')}</details>`:'';
 return `<div class="guest"><div class="guest-top"><div><div class="guest-name">${escapeHtml(guest.name)}</div><div class="guest-email">${guest.email?`E-mail: ${escapeHtml(guest.email)}`:'Geen e-mailadres opgegeven'}</div></div></div><div class="guest-statuses">${statuses.join('')}</div>${dietary}${history}</div>`
}
function renderDietary(requirements){
 if(!Array.isArray(requirements)||!requirements.length)return '';
 return `<div class="dietary"><div class="dietary-title">Allergieën & dieetvoorkeuren</div>${requirements.map(r=>`<div class="dietary-item">${r.category==='vegetarian'?'Vegetarisch':r.category==='vegan'?'Vegan':`Andere — ${escapeHtml(r.otherText||'Niet gespecificeerd')}`}</div>`).join('')}</div>`
}
function statusText(status){return status==='attending'?'Aanwezig':status==='declined'?'Niet aanwezig':'Nog geen antwoord'}
function statusClass(status){return status==='attending'?'status-attending':status==='declined'?'status-declined':'status-pending'}
async function toggleInvitation(id,active){try{const response=await fetch('/admin/api/invitation/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,active})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'Kon uitnodiging niet aanpassen.');await loadDashboard()}catch(error){alert(error.message)}}
function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
loadDashboard()
</script>
</body>
</html>
